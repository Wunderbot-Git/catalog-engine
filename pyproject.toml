[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Docs keep compact code snippets; ruff >= 0.16 would reformat code blocks in Markdown.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
