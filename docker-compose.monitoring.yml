services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./infra/grafana-dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./infra/grafana-dashboards/catalog.json:/etc/grafana/provisioning/dashboards/catalog.json:ro
    depends_on:
      - prometheus
