steps:
  # Build API image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/catalog-api:$COMMIT_SHA
      - -f
      - api/Dockerfile
      - .

  # Push API image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/catalog-api:$COMMIT_SHA

  # Build UI image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/catalog-ui:$COMMIT_SHA
      - -f
      - ui/Dockerfile
      - ui/

  # Push UI image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/catalog-ui:$COMMIT_SHA

  # Run Alembic migrations
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --network=cloudbuild
      - gcr.io/$PROJECT_ID/catalog-api:$COMMIT_SHA
      - alembic
      - upgrade
      - head

  # Deploy API to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - catalog-api
      - --image=gcr.io/$PROJECT_ID/catalog-api:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=$_CLOUD_SQL_INSTANCE
      - --set-env-vars=ENV=production
      - --update-secrets=DATABASE_URL=catalog-database-url:latest,IAP_AUDIENCE=catalog-iap-audience:latest,EXPORT_BUCKET=catalog-export-bucket:latest,ALGOLIA_APP_ID=catalog-algolia-app-id:latest,ALGOLIA_API_KEY=catalog-algolia-api-key:latest,ALGOLIA_INDEX_NAME=catalog-algolia-index-name:latest,GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5

  # Deploy UI to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - catalog-ui
      - --image=gcr.io/$PROJECT_ID/catalog-ui:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

substitutions:
  _REGION: us-central1
  _CLOUD_SQL_INSTANCE: ""  # Set via Cloud Build trigger config

options:
  logging: CLOUD_LOGGING_ONLY
