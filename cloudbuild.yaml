steps:
  # Build API image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/catalog-api:$_TAG
      - -f
      - api/Dockerfile
      - .

  # Push API image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/catalog-api:$_TAG

  # Build UI image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=$_API_URL
      - -t
      - gcr.io/$PROJECT_ID/catalog-ui:$_TAG
      - -f
      - ui/Dockerfile
      - ui/

  # Push UI image
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/catalog-ui:$_TAG

  # Deploy API to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - catalog-api
      - --image=gcr.io/$PROJECT_ID/catalog-api:$_TAG
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=$_CLOUD_SQL_INSTANCE
      - --set-env-vars=ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CORS_ORIGINS=$_UI_URL
      - --update-secrets=DATABASE_URL=catalog-database-url:latest,IAP_AUDIENCE=catalog-iap-audience:latest,EXPORT_BUCKET=catalog-export-bucket:latest,ALGOLIA_APP_ID=catalog-algolia-app-id:latest,ALGOLIA_API_KEY=catalog-algolia-api-key:latest,ALGOLIA_INDEX_NAME=catalog-algolia-index-name:latest
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5

  # Deploy UI to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - catalog-ui
      - --image=gcr.io/$PROJECT_ID/catalog-ui:$_TAG
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3

substitutions:
  _REGION: us-central1
  _CLOUD_SQL_INSTANCE: ""  # Set via Cloud Build trigger config
  _TAG: latest  # Override with COMMIT_SHA in trigger config or --substitutions
  _API_URL: ""  # Cloud Run API URL, set after first deploy
  _UI_URL: ""  # Cloud Run UI URL, set after first deploy

options:
  logging: CLOUD_LOGGING_ONLY
